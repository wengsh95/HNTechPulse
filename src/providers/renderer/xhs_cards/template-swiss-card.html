<!doctype html>
<html lang="zh-CN" data-accent="ikb">
<head>
  <meta charset="utf-8">
  <title>HN TechPulse · Xiaohongshu Cards</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    /* Swiss International seed, derived from guizang-social-card. */
    :root,
    [data-accent="ikb"] {
      --paper: #fafaf8;
      --ink: #0a0a0a;
      --grey-1: #f0f0ee;
      --grey-2: #d4d4d2;
      --grey-3: #737373;
      --accent: #002fa7;
      --accent-on: #ffffff;
      --sans: "Inter", "Helvetica Neue", Helvetica, "Noto Sans SC",
        "Microsoft YaHei UI", "PingFang SC", sans-serif;
      --sans-zh: "Noto Sans SC", "Microsoft YaHei UI", "PingFang SC",
        "Inter", sans-serif;
      --mono: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      color: var(--ink);
      font-family: var(--sans);
      padding: 64px 32px;
      -webkit-font-smoothing: antialiased;
    }
    .sheet {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
    }
    .poster {
      position: relative;
      width: 1080px;
      height: 1440px;
      overflow: hidden;
      isolation: isolate;
      background: var(--paper);
      color: var(--ink);
    }
    .content {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 80px 80px 64px;
    }
    .stack { display: flex; flex-direction: column; }
    figure, blockquote, p, h1, h2 { margin: 0; }

    .h-statement {
      max-width: 920px;
      font-family: var(--sans-zh);
      font-size: 112px;
      font-weight: 200;
      line-height: 1.06;
      letter-spacing: -.02em;
    }
    .h-xl {
      max-width: 920px;
      font-family: var(--sans-zh);
      font-size: 96px;
      font-weight: 300;
      line-height: 1.08;
      letter-spacing: -.01em;
      margin-bottom: 44px;
    }
    .h-md {
      font-family: var(--sans-zh);
      font-size: 54px;
      font-weight: 400;
      line-height: 1.22;
    }
    .lead {
      font-family: var(--sans-zh);
      font-size: 30px;
      font-weight: 400;
      line-height: 1.55;
    }
    .t-cat {
      color: var(--accent);
      font-family: var(--sans-zh);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .num-xl {
      font-family: var(--sans);
      font-size: 112px;
      font-weight: 200;
      line-height: .94;
      letter-spacing: -.03em;
    }
    .chrome-min {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 48px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--grey-2);
      margin-bottom: 48px;
      color: var(--grey-3);
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 48px;
      padding-top: 18px;
      border-top: 1px solid var(--grey-2);
      margin-top: auto;
      color: var(--grey-3);
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .hr-accent {
      width: 96px;
      height: 4px;
      border: 0;
      margin: 42px 0 34px;
      background: var(--accent);
    }

    .cover-page::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      width: 260px;
      height: 520px;
      background: var(--accent);
      z-index: 0;
    }
    .cover-page .content { z-index: 1; }
    .cover-page .t-cat { margin-bottom: 38px; }
    .cover-page .h-statement { max-width: 820px; }
    .cover-signal {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 760px;
      margin-top: 64px;
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
    }
    .cover-signal span {
      padding: 24px 0;
      font-family: var(--mono);
      font-size: 22px;
      letter-spacing: .1em;
    }
    .cover-signal span + span { border-left: 1px solid var(--ink); padding-left: 32px; }
    .cover-lead { max-width: 720px; }

    .evidence-image {
      width: 100%;
      height: 500px;
      overflow: hidden;
      margin-bottom: 28px;
      background: var(--grey-1);
      border: 1px solid var(--grey-2);
    }
    .evidence-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    .evidence-fallback {
      min-height: 500px;
      padding: 52px;
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--grey-1);
      border-left: 12px solid var(--accent);
    }

    .ledger-row {
      display: grid;
      grid-template-columns: 116px 1fr;
      gap: 30px;
      align-items: center;
      min-height: 112px;
      padding: 22px 0;
      border-bottom: 1px solid var(--grey-2);
    }
    .ledger-num {
      color: var(--accent);
      font-family: var(--mono);
      font-size: 42px;
      font-weight: 500;
      letter-spacing: .04em;
    }
    .ledger-title {
      font-family: var(--sans-zh);
      font-size: 29px;
      font-weight: 500;
      line-height: 1.42;
    }
    .ledger-sub {
      margin-top: 8px;
      color: var(--grey-3);
      font-family: var(--mono);
      font-size: 17px;
      letter-spacing: .12em;
    }
    .compact-list .ledger-row { min-height: 108px; padding: 16px 0; }
    .compact-list .ledger-title { font-size: 25px; }
    .tall-ledger .ledger-row { min-height: 215px; }

    .stance-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      margin-bottom: 42px;
      background: var(--grey-2);
      border: 1px solid var(--grey-2);
    }
    .stance-stat {
      min-height: 290px;
      padding: 34px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--paper);
    }
    .stance-stat:first-child { background: var(--accent); color: var(--accent-on); }
    .stance-stat:first-child .t-cat { color: var(--accent-on); }
    .debate-focus .ledger-row { min-height: 148px; }

    .quote-stack {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .quote-row {
      min-height: 270px;
      padding: 34px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--grey-1);
      border-left: 8px solid var(--accent);
    }
    .quote-row:nth-child(2) { background: var(--ink); color: var(--paper); }
    .quote-row:nth-child(2) .t-cat { color: var(--paper); }
    .quote-text {
      font-family: var(--sans-zh);
      font-size: 36px;
      font-weight: 400;
      line-height: 1.42;
    }

    .closing-ledger .ledger-row { min-height: 126px; }
    .question-block {
      padding: 34px 40px;
      margin-top: 34px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      background: var(--accent);
      color: var(--accent-on);
    }
    .question-block .t-cat { color: var(--accent-on); }
  </style>
</head>
<body>
  <main class="sheet">
    <!-- POSTERS_HERE -->
  </main>
</body>
</html>
